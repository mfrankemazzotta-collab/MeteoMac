<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MeteoMac · Clima diario</title>
    <meta name="description" content="Cómo viene el año en temperatura y lluvia, comparado con la climatología 1991–2020." />
  </head>
  <body>
    <main>
      <header>
        <h1>MeteoMac</h1>
        <p class="place" id="place">Bariloche · cargando…</p>
      </header>

      <p class="status" id="status" role="status" aria-live="polite">Descargando datos de Open-Meteo…</p>

      <section class="chart-card" aria-labelledby="t-title">
        <h2 id="t-title">Temperatura media diaria</h2>
        <ul class="legend" aria-hidden="true">
          <li><span class="swatch solid temp"></span>Reanálisis</li>
          <li><span class="swatch dashed temp"></span>Preliminar (pronóstico)</li>
        </ul>
        <figure id="chart-temp" class="chart"></figure>
      </section>

      <section class="chart-card" aria-labelledby="p-title">
        <h2 id="p-title">Precipitación acumulada desde el 1 de enero</h2>
        <ul class="legend" aria-hidden="true">
          <li><span class="swatch solid precip"></span>Reanálisis</li>
          <li><span class="swatch dashed precip"></span>Preliminar (pronóstico)</li>
        </ul>
        <figure id="chart-precip" class="chart"></figure>
      </section>

      <footer id="source" class="source"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
